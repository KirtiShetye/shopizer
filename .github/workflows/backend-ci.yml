name: Backend CI

on:
  push:
    branches: [ 3.2.7 ]
    paths:
      - 'sm-**/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'add-*.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ 3.2.7 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean install -DskipTests
      
    - name: Run tests
      run: mvn test
      
    - name: Package JAR
      run: mvn package -DskipTests
      
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shopizer-backend-${{ github.sha }}
        path: sm-shop/target/shopizer.jar
        retention-days: 30

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/shopizer-backend" | tr '[:upper:]' '[:lower:]')
        docker build -t ${IMAGE_NAME}:latest \
                     -t ${IMAGE_NAME}:${{ github.sha }} .
        docker push ${IMAGE_NAME}:latest
        docker push ${IMAGE_NAME}:${{ github.sha }}
        
    - name: Build Summary
      if: always()
      run: |
        echo "✅ Build completed"
        echo "📦 Artifact: shopizer.jar"
        ls -lh sm-shop/target/shopizer.jar
