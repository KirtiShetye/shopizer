name: Backend CI

on:
  push:
    branches: [ 3.2.7 ]
    paths:
      - 'sm-**/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ 3.2.7 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean install -DskipTests
      
    - name: Run tests
      run: mvn test
      
    - name: Package JAR
      run: mvn package -DskipTests
      
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v3
      with:
        name: shopizer-backend-${{ github.sha }}
        path: sm-shop/target/shopizer.jar
        retention-days: 30
        
    - name: Build Summary
      if: always()
      run: |
        echo "✅ Build completed"
        echo "📦 Artifact: shopizer.jar"
        ls -lh sm-shop/target/shopizer.jar
